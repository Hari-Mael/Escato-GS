name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build build-essential \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            libqt6sql6-sqlite \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtqml qml6-module-qtquick-dialogs

      - name: Configurer CMake
        run: cmake -S . -B build -G Ninja

      - name: Compiler
        run: cmake --build build --verbose

      - name: Vérifier que le binaire existe
        run: test -f build/escato_app

      - name: Smoke test (démarrage headless)
        run: |
          export QT_QPA_PLATFORM=offscreen
          export HOME=$RUNNER_TEMP
          timeout 5 ./build/escato_app || code=$?
          if [ "${code:-0}" != "124" ] && [ "${code:-0}" != "0" ]; then
            echo "::error::L'application a planté au démarrage (code $code)"
            exit 1
          fi

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: 'win64_msvc2019_64'

      - name: Configurer l'environnement MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Installer Ninja
        run: choco install ninja --no-progress -y

      - name: Configurer CMake
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        run: cmake --build build --config Release

      - name: Packager (windeployqt)
        run: |
          mkdir dist
          copy build\escato_app.exe dist\
          windeployqt --qmldir qml --release --compiler-runtime dist\escato_app.exe

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compiler l'installateur (hors ligne)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\escato.iss

      - name: Préparer le paquet runtime (installateur en ligne)
        id: runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-app, runtime-stage | Out-Null
          Copy-Item dist\escato_app.exe dist-app\
          Copy-Item dist\* runtime-stage -Recurse -Force
          Remove-Item runtime-stage\escato_app.exe
          Remove-Item runtime-stage\vc_redist*.exe -ErrorAction SilentlyContinue
          Compress-Archive -Path runtime-stage\* -DestinationPath ESCATO-runtime-win64.zip -Force
          $hash = (Get-FileHash ESCATO-runtime-win64.zip -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '1.0.0' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Vérifier la complétude du paquet runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory verify | Out-Null
          Expand-Archive ESCATO-runtime-win64.zip verify -Force
          $required = @('Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Qml.dll', 'Qt6Quick.dll', 'platforms\qwindows.dll', 'sqldrivers\qsqlite.dll')
          $missing = $required | Where-Object { -not (Test-Path (Join-Path verify $_)) }
          if ($missing) { throw "Fichiers manquants dans le runtime : $($missing -join ', ')" }

      - name: Compiler l'installateur (en ligne)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DRuntimeSha256=${{ steps.runtime.outputs.sha256 }} /DMyAppVersion=${{ steps.runtime.outputs.version }} installer\escato-online.iss

      - name: Publier le dossier portable
        uses: actions/upload-artifact@v4
        with:
          name: ESCATO-windows-portable
          path: dist

      - name: Publier l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: ESCATO-windows-installer
          path: dist-installer\ESCATO-Setup.exe

      - name: Publier l'installateur en ligne
        uses: actions/upload-artifact@v4
        with:
          name: ESCATO-windows-installer-online
          path: dist-installer\ESCATO-Setup-Online.exe

      - name: Publier la release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ESCATO-runtime-win64.zip
            dist-installer/ESCATO-Setup-Online.exe
            dist-installer/ESCATO-Setup.exe
