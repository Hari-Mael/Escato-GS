name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build build-essential \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            libqt6sql6-sqlite

      - name: Lint QML (échoue si syntaxe invalide)
        run: |
          FAIL=0
          for f in $(find qml -name '*.qml'); do
            out=$(/usr/lib/qt6/bin/qmllint "$f" 2>&1 | grep -iE "error|Unexpected token|not unique|unavailable" || true)
            if [ -n "$out" ]; then
              echo "=== $f ==="
              echo "$out"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::Erreurs de syntaxe QML détectées ci-dessus"
            exit 1
          fi

      - name: Configurer CMake
        run: cmake -S . -B build -G Ninja

      - name: Compiler
        run: cmake --build build --verbose

      - name: Vérifier que le binaire existe
        run: test -f build/escato_app

      - name: Smoke test (démarrage headless)
        run: |
          export QT_QPA_PLATFORM=offscreen
          export HOME=$RUNNER_TEMP
          timeout 5 ./build/escato_app || code=$?
          # 124 = timeout normal (app tourne sans crash) ; tout autre code = échec réel
          if [ "${code:-0}" != "124" ] && [ "${code:-0}" != "0" ]; then
            echo "::error::L'application a planté au démarrage (code $code)"
            exit 1
          fi

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: 'win64_msvc2019_64'
          modules: 'qtsql'

      - name: Configurer CMake
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Compiler
        run: cmake --build build --config Release

      - name: Packager (windeployqt)
        run: |
          mkdir dist
          copy build\escato_app.exe dist\
          windeployqt --qmldir qml --release dist\escato_app.exe

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compiler l'installateur (hors ligne)
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\escato.iss

      - name: Publier le dossier portable
        uses: actions/upload-artifact@v4
        with:
          name: ESCATO-windows-portable
          path: dist

      - name: Publier l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: ESCATO-windows-installer
          path: dist-installer\ESCATO-Setup.exe
