name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build build-essential \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            libqt6sql6-sqlite

      - name: Lint QML (échoue si syntaxe invalide)
        run: |
          FAIL=0
          for f in $(find qml -name '*.qml'); do
            out=$(/usr/lib/qt6/bin/qmllint "$f" 2>&1 | grep -iE "error|Unexpected token|not unique|unavailable" || true)
            if [ -n "$out" ]; then
              echo "=== $f ==="
              echo "$out"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::Erreurs de syntaxe QML détectées ci-dessus"
            exit 1
          fi

      - name: Configurer CMake
        run: cmake -S . -B build -G Ninja

      - name: Compiler
        run: cmake --build build --verbose

      - name: Vérifier que le binaire existe
        run: test -f build/escato_app

      - name: Smoke test (démarrage headless)
        run: |
          export QT_QPA_PLATFORM=offscreen
          export HOME=$RUNNER_TEMP
          timeout 5 ./build/escato_app || code=$?
          # 124 = timeout normal (app tourne sans crash) ; tout autre code = échec réel
          if [ "${code:-0}" != "124" ] && [ "${code:-0}" != "0" ]; then
            echo "::error::L'application a planté au démarrage (code $code)"
            exit 1
          fi
